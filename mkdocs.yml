site_name: optionslab
site_description: Options analytics for traders and learners — CLI + MCP server in one package.
site_url: https://pradhann.github.io/options-chain-mcp/
repo_url: https://github.com/pradhann/options-chain-mcp
repo_name: pradhann/options-chain-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - CLI reference: cli.md
  - MCP tools: mcp.md
  - Concepts:
    - concepts/index.md
    - Greeks conventions: concepts/greeks.md
    - Vol Dashboard: concepts/dashboard.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pradhann/options-chain-mcp
